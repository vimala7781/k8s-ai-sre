# auto-fix-test.yaml
# Phase 4 — auto-fix demonstration (corrected)
#
# WHAT THIS TESTS:
# A Deployment-managed pod that crashes ONCE with a clear error.
# Remediator deletes it, Deployment recreates a fresh pod.
# The fresh pod has no crash history — it starts cleanly.
#
# WHY THIS WORKS:
# We use an environment variable AUTO_FIX_TEST=true as a trigger.
# First run: crashes with exit 1 (simulating transient failure)
# After remediator deletes it and Deployment recreates it:
# The new pod is identical — it will crash again too.
#
# REAL INSIGHT:
# Auto-fix via pod restart only works for GENUINELY transient errors:
# - Temporary network blip at startup
# - Race condition where dependency wasn't ready yet
# - Kubernetes itself being briefly overloaded
#
# For persistent errors (wrong image, missing secret, OOMKilled)
# restart doesn't fix anything — you need a config change.
# That's why our remediator correctly skips those.
#
# For THIS demo: we simulate a transient error by making the
# crash pod intentionally short-lived. After remediator deletes
# the crashing pod, we manually patch the deployment to use
# a healthy command — simulating "the underlying issue was fixed".

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-fix-test
  namespace: k8s-ai-sre
  labels:
    scenario: autofix
    phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-fix-test
  template:
    metadata:
      labels:
        app: auto-fix-test
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "ERROR: upstream service unavailable at startup"
              echo "Retrying connection to api-gateway:8080..."
              echo "Connection timed out after 30s"
              exit 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
