# missing-secret.yaml
# M1.3 — Simulates pod stuck in Pending due to missing Secret
#
# WHAT THIS TEACHES:
# Kubernetes Secrets store sensitive values: passwords, API keys, tokens.
# A pod can reference a Secret in two ways:
#   1. As an environment variable (envFrom or env[].valueFrom)
#   2. As a mounted volume (a file inside the container)
#
# If the referenced Secret does not exist in the same namespace,
# the pod will NOT start. It stays in Pending state indefinitely.
# Kubernetes won't even try to schedule it on a node.
#
# This is extremely common in real clusters:
#   - A new service is deployed but its Secret wasn't created first
#   - The Secret exists in the wrong namespace
#   - A GitOps pipeline applies the Deployment before the Secret
#
# HOW WE CAUSE IT:
# We tell the pod to load env vars from a Secret called "app-credentials"
# that we deliberately never create.
#
# WHAT TO LOOK FOR after applying:
#   kubectl get pods -n k8s-ai-sre
#   → STATUS: Pending (it never even tries to start)
#
#   kubectl describe pod missing-secret-pod -n k8s-ai-sre
#   → Events: "secret 'app-credentials' not found"
#   → This is one of the clearest errors our AI agent will encounter —
#     the fix is obvious once found: create the secret or fix the reference

apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-pod
  namespace: k8s-ai-sre
  labels:
    scenario: missingsecret
    phase: "1"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo DB_PASSWORD=$DB_PASSWORD; sleep 3600"]
      envFrom:
        - secretRef:
            name: app-credentials    # This secret does not exist — pod will stay Pending
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
  restartPolicy: Always
